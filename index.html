<script>
function updateDateTime() {
  const now = new Date();

  const options = {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric'
  };

  const date = now.toLocaleDateString('en-IN', options);
  const time = now.toLocaleTimeString('en-IN');

  document.getElementById("datetime").innerHTML =
    date + "<br>" + time;
}

updateDateTime();
setInterval(updateDateTime, 1000);
